# =====================================================================
#  BlockBallRanked - partidas rankeds con Elo sobre el plugin BlockBall
# =====================================================================
#
#  IMPORTANTE: las arenas que pongas en "modes.<modo>.arenas" tienen que
#  existir ya en BlockBall, ser de tipo MINIGAME y tener el minimo y el
#  maximo de jugadores por equipo igual al teamSize del modo.
#
#  Ejemplo para un 2v2:
#    /blockball create ranked_2v2_1 &7Ranked 2v2
#    -> en el GUI: Game Type = MINIGAME
#    -> Team Red:  min 2 / max 2      Team Blue: min 2 / max 2
#

database:
  # sqlite (recomendado, no necesita nada) o mysql
  type: sqlite
  # Solo para sqlite: fichero dentro de la carpeta del plugin.
  file: ranked.db
  # Solo para mysql:
  host: localhost
  port: 3306
  database: minecraft
  username: root
  password: ""
  # Prefijo de las tablas.
  table-prefix: bbranked_
  # Parametros extra de la URL JDBC de MySQL.
  mysql-properties: "useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8"

elo:
  # Elo con el que empieza un jugador nuevo.
  starting: 1000
  # Elo minimo posible (nunca se baja de aqui).
  minimum: 0
  # Numero de partidas de colocacion. Durante estas se usa placement-k.
  placement-matches: 10
  # Factor K (cuanto se mueve el Elo por partida).
  placement-k: 60
  base-k: 32
  # Por encima de este Elo se usa high-k, para que la cima sea mas estable.
  high-elo-threshold: 1800
  high-k: 16
  # Ganancia/perdida minima garantizada por partida (0 = desactivado).
  min-gain: 1
  min-loss: 1

  # Que pasa cuando la partida acaba en empate.
  draw:
    # Porcentaje de lo que se habria perdido en una derrota que se pierde al
    # empatar. El empate se muestra como EMPATE y cuenta como empate en las
    # estadisticas, solo cambia cuanto Elo se mueve.
    #   40 -> si una derrota te habria costado 20 Elo, el empate te cuesta 8
    #    0 -> empatar no mueve el Elo
    #  100 -> empatar cuesta lo mismo que perder
    loss-percent: 40

  # MVP: el que mas goles marque en la partida se lleva Elo extra.
  mvp:
    enabled: true
    # Elo extra que se lleva el MVP (se suma a lo que gane o pierda).
    bonus: 5
    # Tamano minimo de equipo para que haya MVP. Con 2, el 1v1 queda fuera
    # (en un 1v1 el MVP no tiene sentido).
    min-team-size: 2
    # Si varios empatan a goles, se lo llevan todos. Si lo pones en false,
    # cuando hay empate no se da MVP a nadie.
    share-on-tie: true

  # Anti-boosting: ganar muchas veces seguidas al MISMO rival da cada vez
  # menos Elo. El contador se reinicia cuando pasan las horas indicadas sin
  # volver a enfrentaros. Solo afecta a lo que GANAS, nunca a lo que pierdes.
  repeat-opponent:
    enabled: true
    # Partidas contra el mismo rival que todavia dan el Elo completo.
    free-matches: 2
    # Cuanto se reduce la ganancia por cada partida extra (0.25 = un 25%).
    reduction-per-match: 0.25
    # Suelo: por muchas veces que juguen, nunca baja de esto.
    min-multiplier: 0.15
    # Horas sin enfrentarse para que el contador vuelva a cero.
    reset-hours: 24
    # Avisa por Discord/consola si detecta un caso muy repetido.
    alert-after: 6

  goal-difference:
    # Si se activa, ganar 5-0 da mas Elo que ganar 1-0.
    enabled: true
    # delta = delta * (1 + factor * ln(1 + diferencia_de_goles))
    factor: 0.18
    # Tope del multiplicador.
    max-multiplier: 1.6

  leaver:
    # Si un jugador abandona la partida, su equipo pierde automaticamente.
    forfeit-on-leave: true
    # Elo extra que pierde el que abandona (ademas de la derrota normal).
    extra-penalty: 25
    # Los companeros del que abandona no pierden Elo.
    protect-teammates: true
    # Segundos que un abandono bloquea al jugador de volver a la cola.
    queue-ban-seconds: 300

queue:
  # Cada cuantos segundos se intenta emparejar.
  check-interval-seconds: 3
  # Diferencia de Elo aceptada al entrar en cola.
  initial-range: 100
  # Cuanto se amplia esa diferencia por cada segundo esperando.
  range-expansion-per-second: 10
  # Diferencia maxima de Elo aceptada.
  max-range: 1000
  # Segundos maximos que una partida puede tardar en arrancar de verdad
  # antes de cancelarse y devolver a los jugadores a la cola.
  start-timeout-seconds: 60
  # Si es true, nadie puede entrar a una arena ranked con /blockball join.
  block-manual-join: true
  # Anti-multicuentas: dos jugadores con la misma IP nunca acaban en la misma
  # partida ranked (ni como rivales ni como companeros). Se quedan en cola
  # hasta que aparezca alguien mas con quien jugar.
  block-same-ip: true

# Parties: jugar con amigos en el mismo equipo.
party:
  enabled: true
  # Maximo de jugadores por party.
  max-size: 3
  # Diferencia de Elo maxima entre dos miembros cualesquiera de la party.
  # Evita que un jugador alto meta a un amigo bajo para farmear partidas
  # faciles (o al reves).
  max-elo-difference: 600
  # Segundos que dura una invitacion antes de caducar.
  invite-timeout-seconds: 60

# Modos de juego. Puedes crear los que quieras.
modes:
  1v1:
    display-name: "1v1"
    team-size: 1
    arenas:
      - ranked_1v1_1
      - ranked_1v1_2
  2v2:
    display-name: "2v2"
    team-size: 2
    arenas:
      - ranked_2v2_1
  3v3:
    display-name: "3v3"
    team-size: 3
    arenas:
      - ranked_3v3_1

# Divisiones. Se ordenan solas por min-elo. La primera cuyo min-elo sea
# menor o igual al Elo del jugador (empezando por la mas alta) es la suya.
ranks:
  - id: hierro
    display-name: "<gray>Hierro</gray>"
    min-elo: 0
  - id: bronce
    display-name: "<color:#cd7f32>Bronce</color>"
    min-elo: 900
  - id: plata
    display-name: "<white>Plata</white>"
    min-elo: 1100
  - id: oro
    display-name: "<gold>Oro</gold>"
    min-elo: 1300
  - id: platino
    display-name: "<aqua>Platino</aqua>"
    min-elo: 1500
  - id: diamante
    display-name: "<blue>Diamante</blue>"
    min-elo: 1700
  - id: maestro
    display-name: "<light_purple>Maestro</light_purple>"
    min-elo: 1900
  - id: gran-maestro
    display-name: "<red>Gran Maestro</red>"
    min-elo: 2100

leaderboard:
  # Entradas por pagina en /ranked top.
  page-size: 10
  # Partidas minimas para aparecer en el top.
  # OJO: si lo subes, los jugadores nuevos no salen en /ranked top hasta que
  # lleguen a ese numero de partidas. Con 0 sale todo el mundo.
  min-matches: 0
  # Cada cuantos segundos se refresca la cache usada por los placeholders
  # (%bbranked_top_name_1%, %bbranked_position%...). El comando /ranked top
  # siempre consulta la base de datos directamente.
  refresh-seconds: 60

# Barra de accion (el texto encima de la hotbar).
actionbar:
  # Mientras esperas en cola te muestra el modo, cuanta gente falta y el
  # tiempo que llevas esperando.
  queue-enabled: true
  # Cada cuantos ticks se actualiza (20 ticks = 1 segundo).
  update-interval-ticks: 20
  # Al ganar el MVP te avisa por la barra de accion y te dice cuantos llevas.
  mvp-enabled: true
  # Segundos que se queda el aviso del MVP.
  mvp-seconds: 5

# Sonidos. Formato: "nombre volumen tono" (volumen y tono son opcionales).
# El tono va de 0.5 a 2.0. Pon "none" para quitar un sonido.
# Lista de sonidos: https://minecraft.wiki/w/Sounds.json
sounds:
  enabled: true
  queue-join: "entity.experience_orb.pickup 1.0 1.5"
  queue-leave: "block.note_block.bass 1.0 0.8"
  match-found: "block.anvil_land 0.6 1.6"
  match-start: "entity.ender_dragon.growl 0.4 1.6"
  goal: "entity.firework_rocket.blast 1.0 1.0"
  victory: "ui.toast.challenge_complete 1.0 1.0"
  defeat: "entity.villager.no 1.0 0.8"
  draw: "block.note_block.bass 1.0 1.2"
  mvp: "ui.toast.challenge_complete 1.0 1.4"
  rank-up: "entity.player.levelup 1.0 1.0"
  rank-down: "block.anvil_land 1.0 0.5"
  error: "block.note_block.bass 1.0 0.5"
  party-invite: "entity.experience_orb.pickup 1.0 1.8"
  party-join: "entity.player.levelup 0.6 1.6"
  ready-check: "block.note_block.pling 1.0 1.8"
  ready-accept: "entity.experience_orb.pickup 1.0 1.2"

# Confirmacion antes de empezar. Cuando se forma la partida, todos tienen que
# pulsar ACEPTAR en el chat. Quien no acepte se lleva penalizacion y los demas
# vuelven a la cola sin perder su sitio. Evita las partidas arruinadas por AFK.
ready-check:
  enabled: true
  # Segundos para aceptar.
  seconds: 20
  # Segundos de penalizacion de cola para quien no acepte.
  penalty-seconds: 120

# Decaimiento por inactividad: si no juegas, bajas poco a poco. Evita que
# alguien llegue arriba y se retire para quedarse ahi toda la temporada.
decay:
  enabled: false
  # Dias sin jugar antes de que empiece a bajar.
  inactive-days: 14
  # Elo que se pierde por cada dia de inactividad a partir de ahi.
  elo-per-day: 10
  # Nunca baja de aqui por inactividad.
  floor: 1200
  # Solo afecta a quien ya haya salido de colocacion.
  require-placements: true
  # Cada cuantos minutos se revisa.
  check-interval-minutes: 60

# Temporadas. Al cerrar una se guarda el ranking final, se reparten premios y
# el Elo se acerca al centro (no se resetea del todo).
season:
  enabled: true
  # nuevo_elo = target + (elo_actual - target) * factor
  #   factor 0.5 -> alguien con 2000 empieza la siguiente en 1500
  #   factor 1.0 -> no se resetea nada
  #   factor 0.0 -> todos vuelven al target
  soft-reset:
    target: 1000
    factor: 0.5
  # Comandos al cerrar la temporada. {player} es el nombre del jugador.
  rewards:
    # Por puesto final en el ranking.
    top:
      1:
        - "give {player} diamond_block 10"
        - "broadcast &6{player} &fha ganado la temporada &6{season}&f!"
      2:
        - "give {player} diamond_block 5"
      3:
        - "give {player} diamond_block 3"
    # Por division final. Usa los mismos ids que en 'ranks'.
    ranks:
      gran-maestro:
        - "give {player} netherite_ingot 2"
      maestro:
        - "give {player} diamond 16"

# Menu grafico con /ranked menu.
menu:
  enabled: true
  title: "<gradient:#ffe259:#ffa751>Ranked</gradient>"
  # Icono de cada modo. Usa nombres de material de Minecraft.
  mode-icons:
    1v1: "IRON_BOOTS"
    2v2: "GOLDEN_BOOTS"
    3v3: "DIAMOND_BOOTS"
  default-mode-icon: "LEATHER_BOOTS"

# Avisos a un canal de Discord.
#
# Como conseguir la URL: Ajustes del servidor -> Integraciones -> Webhooks ->
# Nuevo webhook -> elige canal -> Copiar URL.
#
# CUIDADO: esa URL es como una contrasena. Quien la tenga puede publicar en tu
# canal. No la subas a ningun sitio publico ni la ensenes en capturas.
discord:
  enabled: false
  webhook-url: ""
  # Nombre con el que aparecen los mensajes.
  username: "Ranked"
  # Que se anuncia.
  send-match-results: true
  send-rank-changes: true
  send-season-end: true
  send-boosting-alerts: true

# Anuncia el resultado de las partidas ranked a todo el servidor.
broadcast-results: false
