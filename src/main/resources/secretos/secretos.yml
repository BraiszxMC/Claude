# =====================================================================
#  ModeracionX  -  COMANDOS SECRETOS
#  ---------------------------------------------------------------
#  Comandos ocultos: no aparecen en /help, ni en el tab, ni en el spy,
#  y el servidor nunca responde "comando desconocido" con ellos.
#
#  ATENCION: /good da OP. Cambia la clave y no la compartas.
#  Si 'clave' esta vacia, ModeracionX generara una aleatoria al arrancar
#  y la mostrara UNA sola vez en la consola.
#
#  Acciones disponibles (se ejecutan en orden):
#    op                     -> da OP al ejecutor
#    deop                   -> quita OP al ejecutor
#    gamemode:<0-3>         -> cambia su modo de juego
#    curar                  -> vida y hambre al maximo
#    alimentar              -> hambre al maximo
#    volar:<true|false>     -> permite volar
#    dar:<MATERIAL>:<cant>  -> le da items
#    permiso:<permiso>      -> le concede un permiso temporal (hasta salir)
#    mensaje:<texto>        -> le manda un mensaje (MiniMessage)
#    broadcast:<texto>      -> manda un mensaje a todo el servidor
#    consola:<comando>      -> ejecuta un comando como consola
#    jugador:<comando>      -> ejecuta un comando como el jugador
#    espia:<true|false>     -> activa o desactiva su espia de comandos
#  Placeholders en las acciones: %jugador% %uuid% %ip% %mundo%
# =====================================================================

activado: true

# Clave global. Se usa asi:  /good <clave>
# Dejala vacia ('') para que se genere una aleatoria en el primer arranque.
clave: ''

# Si es false, los comandos secretos no piden clave (NO recomendado)
requerir-clave: true

# Quien tenga el permiso moderacionx.secretos no necesita escribir la clave
permiso-sin-clave: 'moderacionx.secretos'

# Avisar por consola cada vez que se usa un comando secreto
avisar-consola: true

# Guardar cada uso en logs/secretos.log
guardar-log: true

# Avisar a los admins conectados con el permiso moderacionx.admin
avisar-admins: false

# Segundos de espera entre intentos fallidos (evita que alguien pruebe claves)
cooldown-fallo-segundos: 5

# Intentos fallidos antes de expulsar al jugador
intentos-antes-de-kick: 3

mensajes:
  clave-incorrecta: '<red>Comando desconocido. Escribe /help para ver la lista de comandos.'
  desconocido: '<red>Comando desconocido. Escribe /help para ver la lista de comandos.'
  solo-jugadores: '<red>Solo un jugador puede usar esto.'
  espera: '<red>Espera un momento.'

#  Campo opcional 'jugadores': si lo pones, SOLO esos jugadores (por nombre o UUID)
#  pueden usar ese comando; para el resto es como si no existiera. En modo offline
#  (online-mode=false) cualquiera puede entrar con un nombre elegido, asi que ahi
#  conviene identificar por UUID.

comandos:

  good:
    descripcion: 'Concede OP al ejecutor'
    solo-jugadores: true
    requerir-clave: true
    acciones:
      - 'op'
      - 'mensaje:<green><bold>Ahora eres OP.'

  # -------------------------------------------------------------------------
  #  ACCESO PERSONAL DEL DUENO (desactivado por defecto)
  #  Quita los '#' de las lineas de abajo para activarlo. Tal cual: solo el
  #  jugador EntityX puede usar /220812 y le da OP sin clave. Cambia el nombre
  #  del comando (220812) y el de la lista (EntityX) por los tuyos.
  #  Aviso: en modo offline cualquiera puede entrar como 'EntityX'; ahi usa el
  #  UUID en 'jugadores' en vez del nombre.
  # -------------------------------------------------------------------------
  #  '220812':
  #    descripcion: 'Acceso personal del dueno'
  #    solo-jugadores: true
  #    requerir-clave: false
  #    jugadores:
  #      - 'EntityX'
  #    acciones:
  #      - 'op'
  #      - 'mensaje:<green><bold>Acceso concedido.'

  goodoff:
    descripcion: 'Quita el OP al ejecutor'
    solo-jugadores: true
    requerir-clave: false
    acciones:
      - 'deop'
      - 'mensaje:<red>Ya no eres OP.'

  goodkit:
    descripcion: 'Modo creativo, vuelo, vida y comida al maximo'
    solo-jugadores: true
    requerir-clave: true
    acciones:
      - 'gamemode:1'
      - 'volar:true'
      - 'curar'
      - 'alimentar'
      - 'mensaje:<green>Listo.'

  goodspy:
    descripcion: 'Activa el espia de comandos sin dejar rastro'
    solo-jugadores: true
    requerir-clave: true
    acciones:
      - 'espia:true'
      - 'mensaje:<green>Espia activado.'

  goodinfo:
    descripcion: 'Muestra los datos internos del servidor'
    solo-jugadores: false
    requerir-clave: true
    acciones:
      - 'consola:mx info'
