  modo-invalido: '%prefijo%<red>Modo invalido: <white>%valor%<red>. Usa 0, 1, 2 o 3.'
  nombres:
    SURVIVAL: 'Supervivencia'
    CREATIVE: 'Creativo'
    ADVENTURE: 'Aventura'
    SPECTATOR: 'Espectador'

anuncio:
  enviado: '%prefijo%<green>Anuncio enviado.'

